name: Update Data

on:
  workflow_dispatch:

  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JSON
        run: |
          mkdir -p data

          curl -L "${{ secrets.SHEET_API }}" \
          -o data/data.json

      - name: Commit changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/data.json

          git diff --cached --quiet || (
            git commit -m "Auto update data"
            git push
          )
