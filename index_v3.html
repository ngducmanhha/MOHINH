<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mạnh Hà Mê Chơi Đồ</title>
<style>
:root{
--bg:#0b0b0d;--card:#17181c;--orange:#ff6a00;--red:#ff2d20;--text:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:Arial,sans-serif;color:#fff}
.container{max-width:560px;margin:auto;padding:10px}
.hero{
background:linear-gradient(135deg,#d60000,#ff6a00);
border-radius:24px;padding:14px;margin-bottom:14px;
box-shadow:0 10px 30px rgba(255,80,0,.25)
}
.hero img{width:100%;border-radius:18px;max-height:220px;object-fit:cover;margin-bottom:10px}
.hero h1{font-size:28px;font-weight:900}
.hero p{margin-top:8px}
.cta{
display:block;text-align:center;background:#ffd400;color:#000;
padding:14px;border-radius:14px;text-decoration:none;font-weight:800;margin-top:12px
}
.section-title{font-size:20px;font-weight:800;margin:16px 0 10px}
.prizes{display:flex;overflow:auto;gap:10px}
.prize{min-width:140px;background:var(--card);border-radius:16px;padding:8px}
.prize img{width:100%;height:100px;object-fit:cover;border-radius:12px}
.prize div{margin-top:6px;font-size:13px;font-weight:700}

.menu{display:flex;gap:8px;overflow:auto;margin:14px 0}
.menu span{background:#222;padding:8px 12px;border-radius:999px;white-space:nowrap;font-size:13px}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.card{
background:var(--card);
border-radius:18px;
overflow:hidden;
border:1px solid #25262b;
}

.card img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
display:block;
}

.content{padding:10px}

.badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.badge{
font-size:10px;
padding:3px 7px;
border-radius:999px;
font-weight:700;
}
.hot{background:#ff2d20}
.featured{background:#7a3cff}

.brand{
font-size:11px;
color:#aaa;
margin-bottom:4px;
}

.name{
font-size:14px;
font-weight:800;
line-height:1.25;
height:36px;
overflow:hidden;
margin-bottom:6px;
}

.old{
font-size:11px;
color:#888;
text-decoration:line-through;
}

.sale{
font-size:22px;
font-weight:900;
color:#ffd54f;
}

.stock{
font-size:11px;
color:#ffb74d;
margin:6px 0;
}

.btn{
display:block;
text-align:center;
background:linear-gradient(135deg,#ff6a00,#ff2d20);
color:#fff;
text-decoration:none;
padding:10px;
border-radius:10px;
font-size:12px;
font-weight:800;
}

.social{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:16px;
}

.social a{
background:#222;
padding:12px;
text-align:center;
color:#fff;
text-decoration:none;
border-radius:12px;
}

.loading{text-align:center;padding:40px}
</style>
</head>
<body>
<div class="container">
<div id="app" class="loading">Đang tải dữ liệu...</div>
</div>

<script>
const API="https://sheetdb.io/api/v1/t13pc064b9hcm";

async function getSheet(name){
 const r=await fetch(API+"?sheet="+name);
 return r.json();
}

function toObj(rows){
 let o={};
 rows.forEach(r=>o[r.key]=r.value);
 return o;
}

(async()=>{
try{
const [cfgRows,eventRows,products,prizes]=await Promise.all([
getSheet("CONFIG"),
getSheet("EVENT"),
getSheet("PRODUCTS"),
getSheet("PRIZES")
]);

const cfg=toObj(cfgRows);
const ev=toObj(eventRows);

let html='';

html+=`
<div class="hero">
${cfg.hero_image?`<img src="${cfg.hero_image}">`:''}
<h1>${cfg.page_title||'Mạnh Hà Mê Chơi Đồ'}</h1>
<p>${ev.description||''}</p>
<p>📅 ${ev.start_date||''} - ${ev.end_date||''}</p>
<a class="cta" href="${ev.form_link||'#'}" target="_blank">
${ev.button_text||'NHẬN SỐ QUAY THƯỞNG'}
</a>
</div>`;

html+=`<div class="section-title">🎁 Giải thưởng</div><div class="prizes">`;
prizes.forEach(p=>{
html+=`<div class="prize">
${p.image?`<img src="${p.image}">`:''}
<div>${p.name||''}</div>
</div>`;
});
html+='</div>';

html+=`
<div class="menu">
<span>🔥 Trending</span>
<span>⚡ Giá đáy</span>
<span>🤖 Motor Nuclear</span>
<span>🎯 Bandai</span>
</div>`;

html+=`<div class="section-title">🛒 Deal hôm nay</div>`;
html+=`<div class="grid">`;

products
.filter(p=>p.active==="TRUE")
.sort((a,b)=>(b.featured==="TRUE")-(a.featured==="TRUE"))
.forEach(p=>{
html+=`
<div class="card">
<img src="${p.image_url||''}">
<div class="content">

<div class="badges">
${p.hot==="TRUE"?'<span class="badge hot">HOT</span>':''}
${p.featured==="TRUE"?'<span class="badge featured">TOP</span>':''}
</div>

<div class="brand">${p.brand||''}</div>
<div class="name">${p.product_name||''}</div>

<div class="old">${p.original_price||''}</div>
<div class="sale">${p.sale_price||''}</div>

<div class="stock">${p.stock_text||''}</div>

<a class="btn" href="${p.affiliate_link||'#'}" target="_blank">
XEM GIÁ ĐÁY
</a>

</div>
</div>`;
});

html+='</div>';

html+=`
<div class="social">
<a href="${cfg.zalo_link||'#'}" target="_blank">👥 Zalo</a>
<a href="${cfg.youtube_link||'#'}" target="_blank">▶️ YouTube</a>
</div>`;

document.getElementById('app').className='';
document.getElementById('app').innerHTML=html;

}catch(e){
document.getElementById('app').innerHTML='Lỗi: '+e;
}
})();
</script>
</body>
</html>
