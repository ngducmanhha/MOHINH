<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mạnh Hà Mê Chơi Đồ</title>
</head>

<body>

<h1>Mạnh Hà Mê Chơi Đồ</h1>

<div id="products"></div>

<script>

fetch("https://sheetdb.io/api/v1/t13pc064b9hcm?sheet=PRODUCTS")
.then(response => response.json())
.then(data => {

console.log(data);

document.getElementById("products").innerHTML =
"<pre>" + JSON.stringify(data, null, 2) + "</pre>";

})
.catch(error => {

document.getElementById("products").innerHTML =
"<h2>Lỗi:</h2><pre>" + error + "</pre>";

});

</script>a

</body>
</html>
