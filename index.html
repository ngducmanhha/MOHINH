<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mạnh Hà Mê Chơi Đồ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#111;color:#fff}
.container{max-width:480px;margin:auto;padding:12px}
.hero{background:linear-gradient(135deg,#c40000,#ff3b00);padding:18px;border-radius:18px;margin:12px 0}
.hero h1{font-size:28px;margin-bottom:8px}
.hero p{font-size:14px;opacity:.95}
.cta{display:block;background:#ffd400;color:#000;text-align:center;padding:14px;border-radius:12px;text-decoration:none;font-weight:bold;margin-top:12px}
.section-title{font-size:22px;margin:20px 0 12px}
.prize-box,.social-box{background:#1b1b1b;padding:14px;border-radius:16px;margin-bottom:14px}
.product{background:#1b1b1b;border-radius:18px;overflow:hidden;margin-bottom:18px}
.product img{width:100%;display:block}
.content{padding:14px}
.hot{display:inline-block;background:#ff3b00;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:bold}
.brand{color:#aaa;margin-top:8px}
.name{font-size:20px;font-weight:bold;margin:8px 0}
.old{text-decoration:line-through;color:#888}
.sale{font-size:30px;color:#ffd54f;font-weight:bold;margin:6px 0}
.stock{color:#ff9800;margin-bottom:12px}
.btn{display:block;text-align:center;background:#ff6d00;color:#fff;text-decoration:none;padding:14px;border-radius:12px;font-weight:bold}
.loading{text-align:center;padding:30px}
</style>
</head>
<body>
<div class="container">
<div id="app"><div class="loading">Đang tải dữ liệu...</div></div>
</div>

<script>
const API="https://sheetdb.io/api/v1/t13pc064b9hcm";

async function loadSheet(sheet){
 const r=await fetch(API+"?sheet="+sheet);
 return await r.json();
}

function kvToObj(rows){
 const obj={};
 rows.forEach(r=>obj[r.key]=r.value);
 return obj;
}

async function init(){
 try{
   const [configRows,eventRows,products,prizes] = await Promise.all([
      loadSheet("CONFIG"),
      loadSheet("EVENT"),
      loadSheet("PRODUCTS"),
      loadSheet("PRIZES")
   ]);

   const config=kvToObj(configRows);
   const event=kvToObj(eventRows);

   document.title=config.page_title || "Mạnh Hà Mê Chơi Đồ";

   let html='';

   html += `
   <div class="hero">
      <h1>${config.page_title || 'Mạnh Hà Mê Chơi Đồ'}</h1>
      <p>${event.description || ''}</p>
      <p><b>${event.start_date || ''}</b> → <b>${event.end_date || ''}</b></p>
      <a class="cta" href="${event.form_link || '#'}" target="_blank">
         ${event.button_text || 'Nhận số quay thưởng'}
      </a>
   </div>
   `;

   html += '<div class="section-title">🎁 Giải thưởng</div>';
   html += '<div class="prize-box">';

   prizes.forEach(p=>{
      html += `<div style="margin-bottom:10px">🏆 ${p.name}</div>`;
   });

   html += '</div>';

   html += '<div class="section-title">🔥 Deal nổi bật</div>';

   products
   .filter(p=>p.active==="TRUE")
   .forEach(p=>{

      html += `
      <div class="product">

         <img src="${p.image_url || ''}">

         <div class="content">

            ${p.hot==="TRUE" ? '<div class="hot">🔥 HOT</div>' : ''}

            <div class="brand">${p.brand || ''}</div>

            <div class="name">${p.product_name || ''}</div>

            <div class="old">Giá gốc: ${p.original_price || ''}</div>

            <div class="sale">${p.sale_price || ''}</div>

            <div class="stock">${p.stock_text || ''}</div>

            <a class="btn"
               href="${p.affiliate_link || '#'}"
               target="_blank">
               🛒 XEM GIÁ ĐÁY
            </a>

         </div>
      </div>
      `;
   });

   html += `
   <div class="social-box">
      <a class="btn"
      href="${config.zalo_link || '#'}"
      target="_blank">
      👥 THAM GIA NHÓM ZALO
      </a>
   </div>
   `;

   document.getElementById('app').innerHTML=html;

 }catch(e){
   document.getElementById('app').innerHTML='Lỗi: '+e;
 }
}

init();
</script>
</body>
</html>
