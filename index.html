<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mạnh Hà Mê Chơi Đồ</title>
<style>
:root{
--bg:#0f0f10;--card:#1b1b1d;--accent:#ff6a00;--accent2:#ff2d20;
--text:#fff;--muted:#b5b5b5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:520px;margin:auto;padding:12px}
.banner{
background:linear-gradient(135deg,var(--accent2),var(--accent));
border-radius:24px;padding:18px;overflow:hidden;position:relative;
box-shadow:0 10px 30px rgba(255,80,0,.25)
}
.banner img{width:100%;border-radius:16px;margin-bottom:12px;max-height:240px;object-fit:cover}
.title{font-size:30px;font-weight:800}
.desc{margin-top:8px;line-height:1.4}
.cta{
display:block;text-align:center;margin-top:14px;background:#ffd400;color:#000;
padding:14px;border-radius:14px;text-decoration:none;font-weight:700
}
.section{margin-top:20px}
.section h2{font-size:22px;margin-bottom:10px}
.prizes{display:flex;gap:10px;overflow:auto}
.prize{
min-width:150px;background:var(--card);border-radius:18px;padding:10px
}
.prize img{width:100%;height:120px;object-fit:cover;border-radius:12px}
.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}
.tab{background:#222;padding:8px 14px;border-radius:999px;white-space:nowrap}
.product{
background:var(--card);border-radius:20px;overflow:hidden;
margin-bottom:16px;border:1px solid #2d2d2d
}
.product img{width:100%;height:260px;object-fit:cover}
.content{padding:14px}
.badges{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.badge{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.hot{background:#ff2d20}
.featured{background:#7b2cff}
.brand{color:var(--muted)}
.name{font-size:22px;font-weight:800;margin:8px 0}
.desc2{color:#d0d0d0;font-size:14px}
.priceRow{margin:12px 0}
.old{text-decoration:line-through;color:#8d8d8d}
.sale{font-size:30px;color:#ffd54f;font-weight:800}
.stock{color:#ffb74d}
.btn{
display:block;text-decoration:none;text-align:center;background:var(--accent);
color:white;padding:14px;border-radius:14px;font-weight:800;margin-top:12px
}
.social{
display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px
}
.social a{
background:#222;color:#fff;text-decoration:none;padding:12px;border-radius:14px;text-align:center
}
.loading{text-align:center;padding:40px}
</style>
</head>
<body>
<div class="wrap">
<div id="app" class="loading">Đang tải dữ liệu...</div>
</div>

<script>
const API="https://sheetdb.io/api/v1/t13pc064b9hcm";

async function sheet(name){
 const r=await fetch(API+"?sheet="+name);
 return r.json();
}

function kv(rows){
 const o={};
 rows.forEach(r=>o[r.key]=r.value);
 return o;
}

async function run(){
 try{
  const [cfgR,eventR,products,prizes]=await Promise.all([
   sheet("CONFIG"),
   sheet("EVENT"),
   sheet("PRODUCTS"),
   sheet("PRIZES")
  ]);

  const cfg=kv(cfgR);
  const ev=kv(eventR);

  let h='';

  h+=`
  <div class="banner">
    ${cfg.hero_image?`<img src="${cfg.hero_image}">`:''}
    <div class="title">${cfg.page_title||'Mạnh Hà Mê Chơi Đồ'}</div>
    <div class="desc">${ev.description||''}</div>
    <div class="desc">📅 ${ev.start_date||''} → ${ev.end_date||''}</div>
    <a class="cta" href="${ev.form_link||'#'}" target="_blank">
      ${ev.button_text||'Nhận số quay thưởng'}
    </a>
  </div>`;

  h+=`<div class="section"><h2>🎁 Giải thưởng</h2><div class="prizes">`;
  prizes.forEach(p=>{
    h+=`<div class="prize">
    ${p.image?`<img src="${p.image}">`:''}
    <div style="margin-top:8px;font-weight:700">${p.name||''}</div>
    </div>`;
  });
  h+='</div></div>';

  h+=`
  <div class="tabs">
   <div class="tab">🔥 Trending</div>
   <div class="tab">⚡ Giá đáy</div>
   <div class="tab">🤖 Motor Nuclear</div>
   <div class="tab">🎯 Bandai</div>
  </div>`;

  const sorted=[...products].sort((a,b)=>
   (b.featured==="TRUE")-(a.featured==="TRUE")
  );

  sorted.filter(x=>x.active==="TRUE").forEach(p=>{
   h+=`
   <div class="product">
    <img src="${p.image_url||''}">
    <div class="content">

      <div class="badges">
        ${p.hot==="TRUE"?'<span class="badge hot">HOT</span>':''}
        ${p.featured==="TRUE"?'<span class="badge featured">NỔI BẬT</span>':''}
      </div>

      <div class="brand">${p.brand||''}</div>
      <div class="name">${p.product_name||''}</div>
      <div class="desc2">${p.description||''}</div>

      <div class="priceRow">
       <div class="old">${p.original_price||''}</div>
       <div class="sale">${p.sale_price||''}</div>
      </div>

      <div class="stock">📦 ${p.stock_text||''}</div>

      <a class="btn" href="${p.affiliate_link||'#'}" target="_blank">
       🛒 XEM GIÁ ĐÁY
      </a>
    </div>
   </div>`;
  });

  h+=`
  <div class="social">
   <a href="${cfg.zalo_link||'#'}" target="_blank">👥 Zalo</a>
   <a href="${cfg.youtube_link||'#'}" target="_blank">▶️ YouTube</a>
  </div>`;

  document.getElementById('app').className='';
  document.getElementById('app').innerHTML=h;

 }catch(e){
  document.getElementById('app').innerHTML='Lỗi: '+e;
 }
}
run();
</script>
</body>
</html>
